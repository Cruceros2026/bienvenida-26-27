<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tu estrella · Temporada 26-27</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&family=Cormorant+Garamond:ital,wght@1,400&display=swap" rel="stylesheet">
<style>
:root{--noche:#0E1E34;--azul:#152A47;--oro:#E2C275;--oro2:#C9A84C;--texto:#E8ECF2;--tenue:#9AA8BC;--linea:rgba(226,194,117,.35)}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--noche)}
body{min-height:100vh;background:radial-gradient(ellipse at top,#1B3354 0%,var(--azul) 45%,var(--noche) 100%);color:var(--texto);font-family:Jost,system-ui,sans-serif;font-weight:300;padding:28px 16px 40px}
.wrap{max-width:520px;margin:0 auto;border:1px solid var(--linea);padding:30px 20px 26px;text-align:center}
.kicker{font-size:11px;letter-spacing:.42em;color:var(--oro);text-transform:uppercase}
h1{font-weight:300;font-size:30px;letter-spacing:.06em;color:var(--oro);text-transform:uppercase;margin:16px 0 8px;line-height:1.15}
.sub{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:20px;color:var(--oro)}
label{display:block;text-align:left;font-size:12px;letter-spacing:.25em;text-transform:uppercase;color:var(--tenue);margin:24px 0 8px}
textarea,input{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.18);border-radius:10px;color:var(--texto);font:inherit;font-size:18px;padding:14px}
textarea{min-height:110px;resize:none}
textarea:focus,input:focus{outline:none;border-color:var(--oro)}
.cont{font-size:12px;color:var(--tenue);text-align:right;margin-top:6px}
button{margin-top:22px;width:100%;background:var(--oro);color:var(--noche);border:0;border-radius:999px;padding:15px;font:inherit;font-size:16px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer}
button:disabled{opacity:.5}
.error{color:#f2a3a3;font-size:14px;margin-top:10px;min-height:18px}
.ok{display:none;padding:20px 0}
.ok .estrella{width:64px;height:64px;margin:0 auto 18px;background:var(--oro);clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);animation:brilla 1.6s ease-in-out infinite}
@keyframes brilla{50%{transform:scale(1.25) rotate(20deg)}}
.otra{background:none;border:1px solid var(--linea);color:var(--oro)}
footer{margin-top:26px;font-size:10px;letter-spacing:.4em;color:var(--tenue)}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">Temporada 2026 · 2027</div>
  <h1>¿Cómo guiaremos?</h1>
  <div class="sub">Escribe unas pocas palabras y tu estrella aparecerá en el cielo</div>
  <form id="f">
    <label for="texto">Tus palabras</label>
    <textarea id="texto" maxlength="90" placeholder="Ej: Con calma y cercanía"></textarea>
    <div class="cont"><span id="n">0</span> / 90</div>
    <label for="nombre">Tu nombre (opcional)</label>
    <input id="nombre" maxlength="40" autocomplete="given-name">
    <button id="enviar" type="submit">Enviar mi estrella</button>
    <div class="error" id="err"></div>
  </form>
  <div class="ok" id="ok">
    <div class="estrella"></div>
    <div class="sub">Tu estrella ya brilla en el cielo</div>
    <button class="otra" id="otra" type="button">Escribir otra</button>
  </div>
  <footer>ILS TOURS · SILVERSEA</footer>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const cfg={apiKey:"AIzaSyBx9TV7wd06APe98AIIYyZCjUzIAv2_wH0",authDomain:"silversea-26-27.firebaseapp.com",databaseURL:"https://silversea-26-27-default-rtdb.firebaseio.com",projectId:"silversea-26-27"};
firebase.initializeApp(cfg);
const listo=firebase.auth().signInAnonymously().catch(e=>{document.getElementById('err').textContent='No se pudo conectar. Revisa tu internet e intenta de nuevo.'});
const t=document.getElementById('texto'),n=document.getElementById('n'),err=document.getElementById('err'),btn=document.getElementById('enviar');
t.addEventListener('input',()=>{n.textContent=t.value.length;err.textContent=''});
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const texto=t.value.trim();
  if(!texto){err.textContent='Escribe al menos una palabra.';t.focus();return}
  btn.disabled=true;btn.textContent='Enviando…';
  try{
    await listo;
    await firebase.database().ref('capacitacion2627/estrellas').push({texto:texto.slice(0,90),nombre:document.getElementById('nombre').value.trim().slice(0,40),ts:Date.now()});
    document.getElementById('f').style.display='none';document.getElementById('ok').style.display='block';
  }catch(x){err.textContent='No se pudo enviar. Intenta de nuevo.'}
  btn.disabled=false;btn.textContent='Enviar mi estrella';
});
document.getElementById('otra').onclick=()=>{t.value='';n.textContent='0';document.getElementById('ok').style.display='none';document.getElementById('f').style.display='block';t.focus()};
</script>
</body>
</html>
